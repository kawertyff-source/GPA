<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srimuang 1/6 | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="bg-gradient"></div>

    <div id="login-screen" class="overlay">
        <div class="glass-card login-box">
            <img src="https://upload.wikimedia.org/wikipedia/th/a/a1/Srimuang_logo.png" class="logo">
            <h2>Command Center 1/6</h2>
            <input type="email" id="email" placeholder="รหัสนักเรียน@simuang.ac.th">
            <input type="password" id="password" placeholder="รหัสผ่าน">
            <button id="loginBtn">เชื่อมต่อระบบ</button>
            <p id="auth-error"></p>
        </div>
    </div>

    <div id="main-app" class="app-container" style="display: none;">
        <aside class="sidebar">
            <div class="profile-section">
                <div id="user-avatar" class="avatar-circle"></div>
                <h3 id="display-name">---</h3>
                <span id="display-id">ID: -----</span>
            </div>
            <nav>
                <button class="nav-btn active" data-page="home">หน้าแรก</button>
                <button class="nav-btn" data-page="grades">บันทึกเกรด</button>
                <button class="nav-btn" data-page="chat">ห้องแชท</button>
                <button id="admin-menu-btn" class="nav-btn admin-only" style="display:none;">Admin Tools</button>
            </nav>
            <button id="logoutBtn" class="logout-link">ออกจากระบบ</button>
        </aside>

        <main class="content-area">
            <section id="page-home" class="page active">
                <div class="announcement-banner" id="banner-area">
                    <marquee id="ann-text">ยังไม่มีประกาศใหม่จากแอดมิน...</marquee>
                </div>
                
                <div class="stat-grid">
                    <div class="glass-card">
                        <p>GPA ของคุณ</p>
                        <h1 id="user-gpa">0.00</h1>
                    </div>
                    <div class="glass-card" id="current-period-box">
                        <p>ขณะนี้กำลังเรียน</p>
                        <h2 id="current-sub">-</h2>
                        <small id="next-sub">ต่อไป: -</small>
                    </div>
                </div>

                <div class="glass-card schedule-container">
                    <h3>ตารางเรียน ม.1/6 (ภาค 2/2568)</h3>
                    <div id="schedule-table-target"></div>
                </div>
            </section>

            <section id="page-grades" class="page">
                <div class="header-inline">
                    <h2>สมุดพกพาดิจิทัล</h2>
                    <button class="btn-main" onclick="toggleModal('gradeModal', true)">+ เพิ่มผลการเรียน</button>
                </div>
                <div class="table-wrapper">
                    <table id="grade-table">
                        <thead>
                            <tr><th>วิชา</th><th>คะแนน</th><th>เกรด</th><th>จัดการ</th></tr>
                        </thead>
                        <tbody id="grade-body"></tbody>
                    </table>
                </div>
            </section>

            <section id="page-chat" class="page">
                <div class="chat-container">
                    <div id="chat-messages" class="chat-list"></div>
                    <div class="chat-input-row">
                        <input type="text" id="chat-input" placeholder="พิมพ์ข้อความ...">
                        <button id="send-chat">ส่ง</button>
                    </div>
                </div>
            </section>

            <section id="page-admin" class="page">
                <h2>ระบบหลังบ้านสำหรับ Admin</h2>
                <div class="admin-grid">
                    <div class="glass-card">
                        <h4>ส่งประกาศถึงทุกคน</h4>
                        <textarea id="admin-ann" placeholder="ใส่ข้อความที่นี่..."></textarea>
                        <button id="update-ann-btn">อัปเดตประกาศ</button>
                    </div>
                    <div class="glass-card full-width">
                        <h4>ภาพรวมเกรดเฉลี่ยทั้งห้อง</h4>
                        <div id="admin-student-list"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="gradeModal" class="modal">
        <div class="modal-content glass-card">
            <h3>เพิ่มผลการเรียน</h3>
            <label>เลือกวิชา</label>
            <select id="sub-select">
                <option>ค21102 คณิตศาสตร์</option>
                <option>ว21102 วิทยาศาสตร์</option>
                <option>ท21102 ภาษาไทย</option>
                <option>อ21102 ภาษาอังกฤษ</option>
                <option>ส21103 สังคมศึกษา</option>
            </select>
            <label>คะแนน (0-100)</label>
            <input type="number" id="score-input" min="0" max="100">
            <div class="modal-footer">
                <button onclick="saveNewGrade()" class="btn-main">บันทึก</button>
                <button onclick="toggleModal('gradeModal', false)">ยกเลิก</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
